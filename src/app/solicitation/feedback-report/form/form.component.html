<!-- <a [routerLink]="['/solicitation/report/', solicitation._id]">{{solicitation.title}}</a> -->
<main id="content" class="bypass-block-target container">
  <div class="clearfix impcontainer pt-3">
    <div class="imppostion">
      <h1 class="srt-page-title srt-title-padding">Feedback Detail</h1>
      <dl class="pb-3 feedback-meta">
        <div class="list">
          <dt class="list-title" style="width: 120px">Solicitation Title:&nbsp;</dt>
          <dd class="list-content">{{title}}</dd>
        </div>
        <div class="list">
          <dt class="list-title" style="width: 142px">Solicitation Number:&nbsp;</dt>
          <dd class="list-content">{{this.solNum}}</dd>
        </div>
        <div class="list">
          <dt class="list-title" style="width: 142px">Submitter:&nbsp;</dt>
          <dd class="list-content">{{submitter}}</dd>
        </div>
        <div class="list">
          <dt class="list-title" style="width: 142px">Submission Date: </dt>
          <dd class="list-content">{{date}}</dd>
        </div>
      </dl>


      <table class="table table-bordered">
        <caption class="usa-sr-only">Feedback questions and the submitter's answers.</caption>
        <thead>
        <tr>
          <th scope="col">Question</th>
          <th scope="col">Answer</th>
        </tr>
        </thead>
        <tbody>
        @for (item of feedback; track item) {
          <tr>
            <td style="font-weight: 800">{{item.question}}<br><span class="feedback-note">{{item.note}}</span></td>
            <td>{{item.answer}}</td>
          </tr>
        }
        </tbody>
      </table>
    </div>
  </div>
</main>
