<!-- header.component.html -->
@if (isLogin) {
  <div id="header">
    <a class="usa-skipnav" href="#content">Skip to Main Content</a>
    <div class="usa-header usa-header--basic">
      <div class="grid-container-widescreen">
        <nav class="usa-nav" role="navigation" aria-label="main navigation">
          <!-- Left Side: Logo Group -->
          <div class="logo-container">
            <img
              src="../../assets/gsa-logo.png"
              alt="GSA Logo"
              aria-label="GSA Logo"
              class="gsa-logo-img"
              />
            <img
              src="../../assets/srtlogo.png"
              alt="SRT Logo"
              class="srt-logo-img"
              />
          </div>
          <!-- Right Side: Navigation Links -->
          <ul class="right-nav-group">
            <li class="nav-item">
              <a
                [routerLink]="['/home']"
                class="nav-link"
                (click)="menuClick('/home')"
                >Home</a
                >
              </li>
              <li class="nav-item">
                <a
                  [routerLink]="['/solicitation/report']"
                  class="nav-link"
                  (click)="menuClick('/solicitation/report')"
                  >Daily Report</a
                  >
                </li>
                <!-- Admin-only navigation items -->
                @if (isGSAAdmin) {
                  <li class="nav-item">
                  <li class="nav-item usa-nav__primary-item" style="position: relative;">
                    <button
                      type="button"
                      class="nav-link usa-accordion__button"
                      id="nav-analytics"
                      [attr.aria-expanded]="isAnalyticsDropdownOpen ? 'true' : 'false'"
                      (click)="isAnalyticsDropdownOpen = !isAnalyticsDropdownOpen"
                      style="background: transparent; border: none; font-size: 0.9rem; color: #71767a; cursor: pointer; display: inline-flex; align-items: center; padding: 0.5rem 0;"
                      >Analytics 
                      <i class="fa fa-angle-down" style="margin-left: 8px;"></i>
                    </button>
                    <ul class="dropdown-menu usa-nav__submenu" [ngStyle]="{'display': isAnalyticsDropdownOpen ? 'block' : 'none'}" style="margin-top: 0; padding-left: 0; list-style: none;">
                      <li><a [routerLink]="['/analytics']" class="dropdown-item" (click)="isAnalyticsDropdownOpen = false; menuClick('/analytics')">System Analytics</a></li>
                      <li><a [routerLink]="['/analytics/ai-pipeline']" class="dropdown-item" (click)="isAnalyticsDropdownOpen = false; menuClick('/analytics/ai-pipeline')">AI Pipeline</a></li>
                    </ul>
                  </li>
                  }
                  @if (isGSAAdmin) {
                    <li class="nav-item">
                      <a
                        [routerLink]="['/admin']"
                        class="nav-link"
                        tabindex="{{ isGSAAdmin ? 0 : -1 }}"
                        (click)="menuClick('/admin')"
                        >Administration</a
                        >
                      </li>
                    }
                    <li class="nav-item">
                      <a
                        [routerLink]="['/help/contactus']"
                        class="nav-link"
                        (click)="menuClick('/help/contactus')"
                        >Contact us</a
                        >
                      </li>
                      <li class="nav-item">
                        <a
                          href="https://app.buyaccessible.gov/"
                          target="_blank"
                          rel="noopener noreferrer"
                          class="nav-link"
                          (click)="menuClick('art-tool')"
                          >
                          ART tool
                          <svg
                            class="external-link-icon"
                            aria-hidden="true"
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            >
                            <path
                              d="M5 3c-1.093 0-2 .907-2 2v14c0 1.093.907 2 2 2h14c1.093 0 2-.907 2-2v-7h-2v7H5V5h7V3H5zm9 0v2h3.586l-9.293 9.293 1.414 1.414L19 6.414V10h2V3h-7z"
                              />
                          </svg>
                        </a>
                      </li>
                      <li class="nav-item">
                        <a
                          [routerLink]="['/help/faq']"
                          class="nav-link"
                          (click)="menuClick('/help/faq')"
                          >FAQs</a
                          >
                        </li>
                        <li class="nav-item">
                          <a
                            href="javascript:void(0)"
                            (click)="onLogout()"
                            (blur)="popUpMenuLostFocus()"
                            class="nav-link"
                            role="menuitem"
                            >Log Out</a
                            >
                          </li>
                        </ul>
                      </nav>
                    </div>
                  </div>
                  <div class="border-bottom border-base-lighter"></div>
                </div>
              }
