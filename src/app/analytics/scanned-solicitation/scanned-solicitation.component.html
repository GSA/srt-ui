<h2 class="srt-blue chart" *ngIf="hasValue" aria-labelledby="num-sol-tooltip">
  Scanned Solicitations
  <span class="tooltip-container">
    <sup class="supfont tooltip-trigger" tabindex="0" role="button"
      aria-label="Number of ICT solicitations scanned in the last 30 days"
      (focus)="showScannedSolicitationsTooltip = true" (blur)="showScannedSolicitationsTooltip = false"
      (keydown.enter)="showScannedSolicitationsTooltip = !showScannedSolicitationsTooltip"
      (keydown.space)="showScannedSolicitationsTooltip = !showScannedSolicitationsTooltip; $event.preventDefault()">
      <i class="fa fa-info-circle info" aria-hidden="true"></i>
    </sup>
    <span class="tooltip-text" [class.show]="showScannedSolicitationsTooltip">
      Number of ICT solicitations scanned in the last 30 days
    </span>
  </span>

  <a href="#" (click)="$event.preventDefault(); downloadCSV();"
    class="download-csv-link link-secondary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Download
    CSV</a>
</h2>

<div class="barchart">
  <div class="positions" aria-hidden="true"># Solicitation</div>
  <div class="positiond" aria-hidden="true">Date</div>
  <div class="positionbar" *ngIf="hasValue">

    <canvas baseChart [datasets]="barChartData" [labels]="barChartLabels" [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
    <div [innerHTML]="this.tabularData"></div>
  </div>
</div>
