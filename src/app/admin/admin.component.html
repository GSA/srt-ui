<main id="content" class="usa-section bypass-block-target">
  <div class="grid-container">
    <app-admin-header (menuClick)="processMenuClick($event)"></app-admin-header>

    <!-- Approved Tab -->
    <app-user-report *ngIf="activeTab === 'approved'"></app-user-report>

    <!-- Masquerade Tab -->
    <masquerade *ngIf="activeTab === 'masquerade'"></masquerade>

    <!-- Metric Downloads Tab -->
    <metric-downloads *ngIf="activeTab === 'metric-downloads'"></metric-downloads>

    <!-- Reports Tab -->
    <div *ngIf="activeTab === 'reports'" class="grid-row grid-gap">
      <!-- Sticky Sidebar -->
      <nav class="usa-sidenav grid-col-2 sticky-sidenav">
        <ul class="usa-sidenav__list no-bullets">
          <!-- NEW link -->
          <li class="usa-sidenav__item">
            <a href="javascript:void(0)" (click)="scroll('anchor-User-Permissions')">
              User Permissions
            </a>
          </li>

          <li class="usa-sidenav__item">
            <a href="javascript:void(0)" (click)="scroll('anchor-Logins-Last-30-Days')">
              Logins
            </a>
          </li>
          <li class="usa-sidenav__item">
            <a href="javascript:void(0)" (click)="scroll('anchor-User-Login-Report')">
              User Login Report
            </a>
          </li>
          <li class="usa-sidenav__item">
            <a href="javascript:void(0)" (click)="scroll('anchor-Feedback-Table')">
              Feedback Table
            </a>
          </li>
        </ul>
      </nav>

      <!-- Main Content Area -->
      <div class="grid-col-10">
        <!-- NEW section -->
        <div id="anchor-User-Permissions" class="scroll-target">
          <app-user-permissions></app-user-permissions>
        </div>

        <div id="anchor-Logins-Last-30-Days" class="scroll-target">
          <app-login-reports></app-login-reports>
        </div>
        <div id="anchor-User-Login-Report" class="scroll-target">
          <app-user-login-report></app-user-login-report>
        </div>
        <div id="anchor-Feedback-Table" class="scroll-target">
          <app-admin-feedback></app-admin-feedback>
        </div>
      </div>
    </div>
  </div>
</main>
