<main id="content" class="usa-section bypass-block-target">
  <div class="grid-container">
    <app-admin-header [initialTab]="activeTab" (menuClick)="processMenuClick($event)"></app-admin-header>

    <!-- Four consolidated panels. Each is focusable so tab switches land
         screen-reader and keyboard users on the selected content. -->

    <!-- USERS: management + approval views; masquerade is a row action -->
    @if (activeTab === 'users') {
      <div id="admin-panel-users" tabindex="-1" class="admin-panel">
        <app-user-management></app-user-management>
      </div>
    }

    <!-- AGENCIES: hierarchy, domain mapping, solicitation access, deviation -->
    @if (activeTab === 'agencies') {
      <div id="admin-panel-agencies" tabindex="-1" class="admin-panel">
        <app-agency-management></app-agency-management>
      </div>
    }

    <!-- ANALYTICS: website analytics + login reports + metric downloads -->
    @if (activeTab === 'analytics') {
      <div id="admin-panel-analytics" tabindex="-1" class="admin-panel">
        <app-website-analytics></app-website-analytics>
        <hr class="admin-panel__rule" />
        <app-login-reports></app-login-reports>
        <hr class="admin-panel__rule" />
        <!-- Metric Downloads as an accordion: exports are an action on the
             data above, not a destination (Phase 4). -->
        <h3 class="collapse-heading">
          <button type="button" class="usa-accordion__button export-toggle"
                  [attr.aria-expanded]="exportOpen" aria-controls="export-panel"
                  (click)="exportOpen = !exportOpen">
            Export data (CSV downloads)
          </button>
        </h3>
        @if (exportOpen) {
          <div id="export-panel">
            <metric-downloads></metric-downloads>
          </div>
        }
      </div>
    }

    <!-- OPERATIONS: system health + audit log -->
    @if (activeTab === 'ops') {
      <div id="admin-panel-ops" tabindex="-1" class="admin-panel">
        <app-system-health></app-system-health>
        <hr class="admin-panel__rule" />
        <app-audit-log></app-audit-log>
      </div>
    }

    <!-- CONTENT: email templates + user feedback -->
    @if (activeTab === 'content') {
      <div id="admin-panel-content" tabindex="-1" class="admin-panel">
        <app-email-templates></app-email-templates>
        <hr class="admin-panel__rule" />
        <app-admin-feedback></app-admin-feedback>
      </div>
    }
  </div>
</main>
