<nav class="active-tabs" aria-label="Administration sections">
  <div class="custom-tabs">
    <ul class="custom-tabs__list" role="tablist">
      <li class="custom-tabs__item" [ngClass]="{'custom-tabs__item--active': active['users']}" role="presentation">
        <button type="button" class="custom-tabs__link" role="tab"
          [attr.aria-selected]="active['users'] ? 'true' : 'false'"
          (click)="menuClick.emit('users'); setActiveTab('users')">
          USERS
        </button>
      </li>
      <li class="custom-tabs__item" [ngClass]="{'custom-tabs__item--active': active['agencies']}" role="presentation">
        <button type="button" class="custom-tabs__link" role="tab"
          [attr.aria-selected]="active['agencies'] ? 'true' : 'false'"
          (click)="menuClick.emit('agencies'); setActiveTab('agencies')">
          AGENCIES
        </button>
      </li>
      <li class="custom-tabs__item" [ngClass]="{'custom-tabs__item--active': active['analytics']}" role="presentation">
        <button type="button" class="custom-tabs__link" role="tab"
          [attr.aria-selected]="active['analytics'] ? 'true' : 'false'"
          (click)="menuClick.emit('analytics'); setActiveTab('analytics')">
          ANALYTICS
        </button>
      </li>
      <li class="custom-tabs__item" [ngClass]="{'custom-tabs__item--active': active['ops']}" role="presentation">
        <button type="button" class="custom-tabs__link" role="tab"
          [attr.aria-selected]="active['ops'] ? 'true' : 'false'"
          (click)="menuClick.emit('ops'); setActiveTab('ops')">
          OPERATIONS
        </button>
      </li>
      <li class="custom-tabs__item" [ngClass]="{'custom-tabs__item--active': active['content']}" role="presentation">
        <button type="button" class="custom-tabs__link" role="tab"
          [attr.aria-selected]="active['content'] ? 'true' : 'false'"
          (click)="menuClick.emit('content'); setActiveTab('content')">
          CONTENT
        </button>
      </li>
    </ul>
  </div>
</nav>
